<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Balance - 家計簿アプリ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
    <div class="background-blobs">
        <div class="blob blob-1"></div>
        <div class="blob blob-2"></div>
    </div>

    <main class="container">
        <header>
            <h1>家計簿</h1>
        </header>

        <section class="dashboard glass-panel">
            <div class="month-navigation">
                <button id="prev-month" class="nav-btn">&lt;</button>
                <input type="month" id="month-selector" class="month-input" value="2026-05">
                <button id="next-month" class="nav-btn">&gt;</button>
            </div>
            <div id="dashboard-content">
                <div class="balance-card">
                    <div class="balance-header">
                        <h3>収支</h3>
                        <button id="btn-calendar-balance" class="icon-btn" title="カレンダー表示">
                            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        </button>
                    </div>
                    <p id="total-balance" class="amount">¥0</p>
                </div>
                <div class="summary-cards">
                    <div class="summary-card income">
                        <h3>収入</h3>
                        <p id="total-income">¥0</p>
                        <div class="chart-container">
                            <canvas id="income-chart"></canvas>
                        </div>
                    </div>
                    <div class="summary-card expense">
                        <h3>支出</h3>
                        <p id="total-expense">¥0</p>
                        <div class="chart-container">
                            <canvas id="expense-chart"></canvas>
                        </div>
                    </div>
                </div>
            </div>
        </section>

        <div class="content-grid">
            <section class="add-transaction glass-panel">
                <h2>記録を追加</h2>
                <form id="transaction-form">
                    <div class="form-group type-toggle">
                        <input type="radio" id="type-expense" name="type" value="expense" checked>
                        <label for="type-expense" class="toggle-btn expense-btn">支出</label>
                        
                        <input type="radio" id="type-income" name="type" value="income">
                        <label for="type-income" class="toggle-btn income-btn">収入</label>
                    </div>

                    <div class="form-group">
                        <label for="date">日付</label>
                        <input type="date" id="date" required>
                    </div>

                    <div class="form-group">
                        <label for="title">名称 (任意)</label>
                        <input type="text" id="title" placeholder="例: レンタカー">
                    </div>

                    <div class="form-group">
                        <label for="amount">金額 (円)</label>
                        <input type="number" id="amount" placeholder="例: 1000" required min="1" inputmode="numeric" pattern="[0-9]*">
                    </div>

                    <div class="form-group">
                        <label for="category">カテゴリー</label>
                        <select id="category" required>
                            <option value="カテゴリーなし" selected>カテゴリーなし</option>
                            <option value="食費">食費</option>
                            <option value="日用品">日用品</option>
                            <option value="交通費">交通費</option>
                            <option value="健康・医療">健康・医療</option>
                            <option value="趣味・娯楽">趣味・娯楽</option>
                            <option value="衣服・美容">衣服・美容</option>
                            <option value="交際費">交際費</option>
                            <option value="水道・光熱費">水道・光熱費</option>
                            <option value="通信費">通信費</option>
                            <option value="教育">教育</option>
                            <option value="その他">その他</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="memo">メモ (任意)</label>
                        <input type="text" id="memo" placeholder="例: 4人で割り勘">
                    </div>

                    <button type="submit" class="submit-btn">追加する</button>
                </form>
            </section>

            <section class="transaction-list glass-panel">
                <div class="list-header">
                    <div class="history-title">
                        <h2>取引履歴</h2>
                        <button id="btn-calendar-history" class="icon-btn" title="カレンダー表示">
                            <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="18" rx="2" ry="2"></rect><line x1="16" y1="2" x2="16" y2="6"></line><line x1="8" y1="2" x2="8" y2="6"></line><line x1="3" y1="10" x2="21" y2="10"></line></svg>
                        </button>
                    </div>
                    <div class="filter-group">
                        <button class="filter-btn active" data-filter="all">すべて</button>
                        <button class="filter-btn" data-filter="income">収入</button>
                        <button class="filter-btn" data-filter="expense">支出</button>
                    </div>
                </div>
                <ul id="list" class="list">
                    <!-- Transactions will be added here via JS -->
                </ul>
                <div id="empty-state" class="empty-state hidden">
                    <p>記録がありません</p>
                </div>
            </section>
        </div>
    </main>

    <!-- カレンダーモーダル -->
    <div id="calendar-modal" class="modal hidden">
        <div class="modal-content glass-panel calendar-modal-content">
            <div class="modal-header">
                <button id="cal-prev" class="nav-btn">&lt;</button>
                <h2 id="cal-month-display">2026年5月</h2>
                <button id="cal-next" class="nav-btn">&gt;</button>
                <button id="close-calendar" class="close-btn">&times;</button>
            </div>
            <div class="calendar-grid-header">
                <div>日</div><div>月</div><div>火</div><div>水</div><div>木</div><div>金</div><div>土</div>
            </div>
            <div class="calendar-grid" id="calendar-grid">
                <!-- 日付マスがここに生成される -->
            </div>
        </div>
    </div>

    <!-- 日付詳細モーダル -->
    <div id="date-details-modal" class="modal hidden">
        <div class="modal-content glass-panel details-modal-content">
            <div class="modal-header">
                <h2 id="details-date-title">2026年5月1日</h2>
                <button id="close-details" class="close-btn">&times;</button>
            </div>
            <div class="details-summary">
                <div class="summary-item income-text">収入: <span id="details-income">￥0</span></div>
                <div class="summary-item expense-text">支出: <span id="details-expense">￥0</span></div>
            </div>
            <ul id="details-transaction-list" class="list">
                <!-- 取引履歴がここに生成される -->
            </ul>
        </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
